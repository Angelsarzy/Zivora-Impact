<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg">
        <nav class="container mx-auto px-6 py-4">
            <ul class="flex justify-center space-x-8">
                <li><a href="index.html" class="flex items-center space-x-2 hover:text-indigo-200"><i class="fas fa-home"></i><span>Home</span></a></li>
                <li><a href="portfolio.html" class="flex items-center space-x-2 hover:text-indigo-200"><i class="fas fa-briefcase"></i><span>Portfolio</span></a></li>
                <li><a href="contact.html" class="flex items-center space-x-2 hover:text-indigo-200"><i class="fas fa-envelope"></i><span>Contact</span></a></li>
            </ul>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12">
        <section id="contact" class="max-w-lg mx-auto">
            <h1 class="text-3xl font-bold mb-4 text-center">Contact Me</h1>
            <p class="text-lg mb-8 text-center">Interested in my web development or Canva design services? Reach out via email, phone, or the form below!</p>
            
            <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                <h2 class="text-xl font-semibold mb-4"><i class="fas fa-info-circle mr-2 text-indigo-600"></i>Contact Information</h2>
                <p class="mb-2"><i class="fas fa-envelope mr-2 text-indigo-600"></i>Email: <a href="ndubuisitruthtonna@gmail.com" class="text-indigo-600 hover:underline">contact@zivoraimpact.com</a></p>
                <p><i class="fas fa-phone mr-2 text-indigo-600"></i>Phone: <a href="tel:+1234567890" class="text-indigo-600 hover:underline">+2347065556434</a></p>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4"><i class="fas fa-comment-alt mr-2 text-indigo-600"></i>Send a Message</h2>
                <form action="https://formspree.io/f/your-form-id" method="POST">
                    <div class="mb-4">
                        <label for="name" class="block text-sm font-medium mb-2"><i class="fas fa-user mr-2"></i>Name</label>
                        <input type="text" id="name" name="name" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" required>
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium mb-2"><i class="fas fa-envelope mr-2"></i>Email</label>
                        <input type="email" id="email" name="email" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" required>
                    </div>
                    <div class="mb-4">
                        <label for="message" class="block text-sm font-medium mb-2"><i class="fas fa-comment mr-2"></i>Message</label>
                        <textarea id="message" name="message" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700"><i class="fas fa-paper-plane mr-2"></i>Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="bg-gray-800 text-white text-center py-4">
        <p>&copy; 2025 Zivora Impact. All rights reserved.</p>
    </footer>
</body>
</html>
